[package]
name = "screen-ascii"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Control Android devices through a live ASCII terminal"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/screen-ascii"

[[bin]]
name = "screen-ascii"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
signal-hook = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
